          encoded = "".join(ENCODED_PAYLOAD.split())
          blob = base64.b64decode(encoded, validate=True)
          if len(blob) != EXPECTED_ARCHIVE_BYTES or hashlib.sha256(blob).hexdigest() != EXPECTED_ARCHIVE_SHA256:
              raise ValueError("embedded archive identity mismatch")
          with gzip.GzipFile(fileobj=io.BytesIO(blob), mode="rb") as stream:
              raw = stream.read(EXPECTED_TAR_BYTES + 1)
          if len(raw) != EXPECTED_TAR_BYTES:
              raise ValueError("embedded archive size mismatch")
          root = Path(os.environ["RUNNER_TEMP"]) / "t2-startup-embedded-payload"
          if root.exists():
              raise ValueError("fresh extraction directory required")
          root.mkdir(mode=0o755)
          expected = {row["path"]: row for row in EXPECTED_FILES}
          if len(expected) != len(EXPECTED_FILES):
              raise ValueError("duplicate embedded file manifest")
          seen = set()
          with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as archive:
              members = archive.getmembers()
              if len(members) != len(expected):
                  raise ValueError("archive member count mismatch")
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or member.name != path.as_posix() or any(part in ("", ".", "..") or part.startswith("._") for part in path.parts):
                      raise ValueError("unsafe embedded member path")
                  if not path.parts or path.parts[0] != "verification_t2_startup" or not member.isfile() or member.issym() or member.islnk():
                      raise ValueError("embedded member must be an approved regular payload file")
                  if member.name not in expected or member.name in seen:
                      raise ValueError("unexpected or duplicate embedded member")
                  row = expected[member.name]
                  if member.size != row["bytes"] or member.mode != 0o444 or member.uid != 0 or member.gid != 0:
                      raise ValueError("embedded member metadata mismatch")
                  stream = archive.extractfile(member)
                  if stream is None:
                      raise ValueError("unreadable embedded member")
                  with stream:
                      body = stream.read(row["bytes"] + 1)
                  if len(body) != row["bytes"] or hashlib.sha256(body).hexdigest() != row["sha256"]:
                      raise ValueError("embedded member identity mismatch")
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, mode=0o755, exist_ok=True)
                  if not target.resolve().is_relative_to(root.resolve()):
                      raise ValueError("embedded destination escapes extraction root")
                  with target.open("xb") as output:
                      output.write(body)
                  target.chmod(0o444)
                  seen.add(member.name)
          if seen != set(expected):
              raise ValueError("embedded archive incomplete")
          print(json.dumps({"status": "PASS_EMBEDDED_PAYLOAD", "archive_sha256": EXPECTED_ARCHIVE_SHA256, "files": len(seen)}))
          PY
      - name: Build the exact three-source replacement locally
        shell: bash
        run: >-
          docker build --platform linux/amd64 --network none
          --tag agenthon-t2-startup-verification:local
          "${RUNNER_TEMP}/t2-startup-embedded-payload/verification_t2_startup"
      - name: Run the fixed offline input and output checks
        shell: bash
        run: >-
          python3 "${RUNNER_TEMP}/t2-startup-embedded-payload/verification_t2_startup/run_linux_verification.py"
          --image agenthon-t2-startup-verification:local
          --work-dir "${RUNNER_TEMP}/t2-startup-verification"
          --results-dir "${RUNNER_TEMP}/t2-startup-verification-results"
      - name: Save mechanical verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-startup-linux-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/t2-startup-verification-results/
          if-no-files-found: error
          retention-days: 14
