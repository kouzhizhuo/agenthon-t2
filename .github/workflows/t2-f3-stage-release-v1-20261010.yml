      - name: Install pinned official host gates and obtain public test inputs
        run: |
          set -euo pipefail
          python -m pip install 'qfbench2-common @ git+https://github.com/Agenthon-2026/Agenthon2026-public.git@v2.6.0#subdirectory=common'
          python -m pip install 'qfbench2-track-forecasting @ git+https://github.com/Agenthon-2026/track2-forecasting-public.git@30c8019d997f930eab9ba569d089d12298d86d8c' pytest==8.4.2
          git clone https://github.com/Agenthon-2026/track2-forecasting-public.git "$RUNNER_TEMP/t2-stage-public"
          git -C "$RUNNER_TEMP/t2-stage-public" checkout --detach 30c8019d997f930eab9ba569d089d12298d86d8c
          python -m pip freeze > "$RUNNER_TEMP/t2-stage-evidence/HOST_DEPENDENCIES.txt"
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('qfbench2-common')=='2.6.0'
          assert importlib.metadata.version('qfbench2-track-forecasting')=='3.1.0'
          PY
      - name: Validate synthetic fixture manifests before running forecasts
        run: |
          set -euo pipefail
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -B -Werror -m pytest "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/ci/test_make_fixtures.py" "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/ci/test_fcm_native_contract.py" "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/ci/test_public_roster.py" "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/ci/test_validate_f3_stage.py" "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/ci/test_f3_wrapper_generated.py" -q
          python "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/ci/make_fixtures.py" --output "$RUNNER_TEMP/t2-stage-fixtures"
      - name: Build exact frozen F3 stage image offline
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 ghcr.io/kouzhizhuo/agenthon-t2-revision1009@sha256:9f2dd057bd9da2b12b6ca792dfddd6d83f7aac7c3af3137cc5de2953691899d5
          docker build --platform linux/amd64 --network=none --pull=false --label org.opencontainers.image.source=https://github.com/kouzhizhuo/agenthon-t2 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag t2-f3-stage-v1-20261010:local "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1"
          docker image inspect t2-f3-stage-v1-20261010:local > "$RUNNER_TEMP/t2-stage-evidence/BUILD_IMAGE_INSPECT.json"
      - name: Run all104 offline F3 and exact FCM parent pairs plus generated controls before publication
        run: >-
          python "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/ci/validate_f3_stage.py"
          --image t2-f3-stage-v1-20261010:local
          --source "$RUNNER_TEMP/t2-stage-payload/f3_stage_release_20261010_v1/source"
          --public-units "$RUNNER_TEMP/t2-stage-public/units"
          --fixtures "$RUNNER_TEMP/t2-stage-fixtures"
          --output "$RUNNER_TEMP/t2-stage-evidence/local"
      - name: Publish complete offline-verified F3 image
        env:
          STAGE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE_GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$STAGE_GITHUB_TOKEN" | docker login ghcr.io --username "$STAGE_GITHUB_ACTOR" --password-stdin
          python - <<'PY'
          import json,os,pathlib,re,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'t2-stage-evidence'
          prefix='ghcr.io/kouzhizhuo/agenthon-t2-revision1009'
          tag=prefix+':f3-stage-v1-20261010-'+os.environ['GITHUB_SHA'][:12]
          subprocess.run(['docker','tag','t2-f3-stage-v1-20261010:local',tag],check=True)
          result=subprocess.run(['docker','push',tag],capture_output=True,text=True,timeout=600)
          token=os.environ.get('STAGE_GITHUB_TOKEN','')
          def safe(s):
              s=s.replace(token,'[redacted]')if token else s
              return re.sub(r'(?i)(authorization\s*[:=]\s*(?:bearer|basic)\s+)\S+',r'\1[redacted]',s)
          (root/'push.stdout.log').write_text(safe(result.stdout));(root/'push.stderr.log').write_text(safe(result.stderr))
          if result.returncode:raise RuntimeError('GHCR push failed; sanitized evidence saved')
          info=json.loads(subprocess.check_output(['docker','image','inspect',tag],text=True))[0]
          images=[x for x in info.get('RepoDigests',[])if x.startswith(prefix+'@sha256:')]
          if len(images)!=1:raise ValueError('exact published image digest not established')
          (root/'PUBLISHED_IMAGE.json').write_text(json.dumps({'image':images[0],'tag':tag,'image_id':info['Id'],'source_commit':os.environ['GITHUB_SHA'],'anonymous_pull_verified':False},indent=2)+'\n')
          print('Published exact F3 stage image:',images[0])
          PY
      - name: Anonymous pull and full published-digest rerun
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,pathlib,subprocess,tempfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'t2-stage-evidence'
          report=json.loads((root/'PUBLISHED_IMAGE.json').read_text())
          with tempfile.TemporaryDirectory()as config:
              pathlib.Path(config,'config.json').write_text('{}\n')
              env={**os.environ,'DOCKER_CONFIG':config}
              subprocess.run(['docker','image','rm',report['tag'],'t2-f3-stage-v1-20261010:local',report['image']],check=False)
              pull=subprocess.run(['docker','pull','--platform','linux/amd64',report['image']],capture_output=True,text=True,env=env,timeout=600)
              (root/'anonymous-pull.stdout.log').write_text(pull.stdout);(root/'anonymous-pull.stderr.log').write_text(pull.stderr)
              if pull.returncode:raise RuntimeError('anonymous stage pull failed')
              payload=pathlib.Path(os.environ['RUNNER_TEMP'])/'t2-stage-payload/f3_stage_release_20261010_v1'
              subprocess.run(['python',str(payload/'ci/validate_f3_stage.py'),'--image',report['image'],'--source',str(payload/'source'),'--public-units',os.environ['RUNNER_TEMP']+'/t2-stage-public/units','--fixtures',os.environ['RUNNER_TEMP']+'/t2-stage-fixtures','--output',str(root/'published')],check=True,env=env)
          subprocess.run(['python',str(payload/'ci/compare_published.py'),'--evidence',str(root)],check=True)
          report['anonymous_pull_verified']=True;report['published_full104_verified']=True;report['positive216_native_roots_byte_verified']=True;report['offline_parent_full104_verified']=True;report['actual_House_service_tested']=False
          (root/'PUBLISHED_IMAGE.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a')as f:f.write('Exact F3 stage digest passed104 offline parent pairs, generated structural controls, anonymous rerun and216positive native-root byte comparisons. Real House service and accuracy remain untested.\n\n'+report['image']+'\nNo accuracy score or CodaBench upload performed.\n')
          PY
      - name: Preserve all success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-f3-stage-v1-20261010-linux-${{ github.run_id }}
          path: ${{ runner.temp }}/t2-stage-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
