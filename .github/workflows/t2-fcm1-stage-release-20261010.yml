          if len(blob)!=56607 or hashlib.sha256(blob).hexdigest()!='ab1130b0b9b5cd7b00cfcc989186aef3afef37c033cd8fff2cc2f0acec6cfc6f':raise ValueError('payload archive identity')
          raw=gzip.decompress(blob)
          if len(raw)!=204800:raise ValueError('payload tar length')
          root=Path(os.environ['RUNNER_TEMP'])/'t2-stage-payload';root.mkdir()
          expected={x['path']:x for x in expected};seen=set()
          with tarfile.open(fileobj=io.BytesIO(raw),mode='r:')as archive:
              for member in archive.getmembers():
                  path=PurePosixPath(member.name)
                  if not member.isfile()or member.name not in expected or member.name in seen or path.is_absolute()or '..'in path.parts or any(x.startswith('._')for x in path.parts):raise ValueError('unsafe member')
                  record=expected[member.name];data=archive.extractfile(member).read()
                  if len(data)!=record['bytes']or hashlib.sha256(data).hexdigest()!=record['sha256']:raise ValueError('member identity')
                  dest=root.joinpath(*path.parts);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data);dest.chmod(0o444);seen.add(member.name)
          if seen!=set(expected):raise ValueError('incomplete payload')
          evidence=Path(os.environ['RUNNER_TEMP'])/'t2-stage-evidence'
